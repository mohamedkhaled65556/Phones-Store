<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Phone Store</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <section class="store-section">

      <div class="store-header">
        <h1>Phone Store</h1>

        <div class="cart-header">
          <div class="search">
            <input
              id="searchInput"
              list="list"
              type="text"
              class="input"
              placeholder="Enter Phone Name"
              oninput="searchList()"
            />

            <datalist id="list"></datalist>

            <button class="btn1 admin-button" onclick="searchByName()">
              <i class="fa-solid fa-magnifying-glass"></i>

              Search
            </button>
          </div>

          <button class="btn1 admin-button" onclick="showProducts()">
            <i class="fa-solid fa-list"></i>

            Show All
          </button>

          <a href="admin-login.html" class="btn1 admin-button">
            <i class="fa-solid fa-user-shield"></i>
            Admin
          </a>

          <div class="cart-container">
            <button
              class="cart-button"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#offcanvasRight"
            >
              <i class="fa-solid fa-cart-shopping"></i>
            </button>

            <span id="Length">0</span>
          </div>
        </div>
      </div>

      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title">Your Cart</h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
          ></button>
        </div>

        <div class="offcanvas-body" id="cartContainer"></div>

        <div class="alert alert-danger m-0">
          <h4>
            Total:
            <span id="TotalCost"> 0</span>$
          </h4>
        </div>
      </div>

      <div id="productArea" class="product-area"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./products-data.js"></script>
    <script src="./products.js"></script>
  </body>
</html>
